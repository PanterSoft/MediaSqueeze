name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: SqueezeCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: make test

  build-app:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          make build | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
