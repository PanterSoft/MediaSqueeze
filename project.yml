name: MediaSqueeze
options:
  bundleIdPrefix: com.pantersoft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SqueezeCore:
    path: Packages/SqueezeCore
targets:
  MediaSqueeze:
    type: application
    platform: iOS
    sources:
      - path: MediaSqueeze
    dependencies:
      - package: SqueezeCore
    info:
      path: MediaSqueeze/Info.plist
      properties:
        CFBundleDisplayName: MediaSqueeze
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: MediaSqueeze reads your videos to compress them and compares your photos and videos to find duplicates. Everything stays on your device.
        NSPhotoLibraryAddUsageDescription: MediaSqueeze saves the compressed copies of your videos to your library.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pantersoft.mediasqueeze
        PRODUCT_NAME: MediaSqueeze
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    scheme:
      gatherCoverageData: false
